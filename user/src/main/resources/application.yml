spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/user
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
